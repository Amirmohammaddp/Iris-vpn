name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Extract project zip
        run: |
          ZIP=$(printf '%s\n' *.zip | LC_ALL=C sort | tail -n 1)
          echo "Using $ZIP"
          mkdir -p /tmp/src
          unzip -q "$ZIP" -d /tmp/src
          PUB=$(find /tmp/src -name pubspec.yaml -not -path '*/.*' | head -n 1)
          echo "PROJECT_DIR=$(dirname "$PUB")" >> "$GITHUB_ENV"

      - name: Generate missing Android platform files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p /tmp/android_backup
          cp -r android/. /tmp/android_backup/
          flutter create . --platforms android --project-name happ_clone --org com.example
          cp -r /tmp/android_backup/. android/
          rm -f android/build.gradle.kts android/settings.gradle.kts android/app/build.gradle.kts

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Check APK
        run: |
          APK="${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk"
          ls -la "$APK"
          unzip -tq "$APK"
          cp "$APK" /tmp/Irisv2ray.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Irisv2ray build ${{ github.run_number }}
          files: /tmp/Irisv2ray.apk

      - uses: actions/upload-artifact@v4
        with:
          name: happ-clone-apk
          path: /tmp/Irisv2ray.apk
          compression-level: 0
